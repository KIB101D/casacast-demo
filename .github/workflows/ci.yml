name: CI

on:
  push:
    branches: [main, demo]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/estate
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      # Before the tests: the publishing queue's integration test runs against this database.
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
